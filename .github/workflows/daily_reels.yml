name: Matrix Pipeline Runner
on:
  schedule:
    - cron: '10 5 * * *'
    - cron: '10 11 * * *'
    - cron: '10 17 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to run (all: sequential staggered run, or single: ja, he, es, fr, de, it, ko, zh, ru, pt)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ja
          - he
          - es
          - fr
          - de
          - it
          - ko
          - zh
          - ru
          - pt
      youtube:
        description: 'YouTube upload mode (auto: strictly 2x daily quota, force: bypass quota, skip: skip YouTube)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - force
          - skip
      cooldown:
        description: 'Cooldown seconds between staggered language uploads (default: 300 = 5 min)'
        required: false
        default: '300'
        type: string

concurrency:
  group: reel-publishing-queue
  cancel-in-progress: false

permissions:
  contents: write

env:
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  AI_MODEL: "openai-large"

  # YouTube OAuth Credentials
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

  # YouTube Refresh Tokens (10 Channels)
  JA_YT_REFRESH_TOKEN: ${{ secrets.JA_YT_REFRESH_TOKEN }}
  HE_YT_REFRESH_TOKEN: ${{ secrets.HE_YT_REFRESH_TOKEN }}
  ES_YT_REFRESH_TOKEN: ${{ secrets.ES_YT_REFRESH_TOKEN }}
  FR_YT_REFRESH_TOKEN: ${{ secrets.FR_YT_REFRESH_TOKEN }}
  DE_YT_REFRESH_TOKEN: ${{ secrets.DE_YT_REFRESH_TOKEN }}
  IT_YT_REFRESH_TOKEN: ${{ secrets.IT_YT_REFRESH_TOKEN }}
  KO_YT_REFRESH_TOKEN: ${{ secrets.KO_YT_REFRESH_TOKEN }}
  ZH_YT_REFRESH_TOKEN: ${{ secrets.ZH_YT_REFRESH_TOKEN }}
  RU_YT_REFRESH_TOKEN: ${{ secrets.RU_YT_REFRESH_TOKEN }}
  PT_YT_REFRESH_TOKEN: ${{ secrets.PT_YT_REFRESH_TOKEN }}

  # Facebook Credentials (10 Pages)
  JA_PAGE_ID: ${{ secrets.JA_PAGE_ID }}
  JA_PAGE_TOKEN: ${{ secrets.JA_PAGE_TOKEN }}
  HE_PAGE_ID: ${{ secrets.HE_PAGE_ID }}
  HE_PAGE_TOKEN: ${{ secrets.HE_PAGE_TOKEN }}
  ES_PAGE_ID: ${{ secrets.ES_PAGE_ID }}
  ES_PAGE_TOKEN: ${{ secrets.ES_PAGE_TOKEN }}
  FR_PAGE_ID: ${{ secrets.FR_PAGE_ID }}
  FR_PAGE_TOKEN: ${{ secrets.FR_PAGE_TOKEN }}
  DE_PAGE_ID: ${{ secrets.DE_PAGE_ID }}
  DE_PAGE_TOKEN: ${{ secrets.DE_PAGE_TOKEN }}
  IT_PAGE_ID: ${{ secrets.IT_PAGE_ID }}
  IT_PAGE_TOKEN: ${{ secrets.IT_PAGE_TOKEN }}
  KO_PAGE_ID: ${{ secrets.KO_PAGE_ID }}
  KO_PAGE_TOKEN: ${{ secrets.KO_PAGE_TOKEN }}
  ZH_PAGE_ID: ${{ secrets.ZH_PAGE_ID }}
  ZH_PAGE_TOKEN: ${{ secrets.ZH_PAGE_TOKEN }}
  RU_PAGE_ID: ${{ secrets.RU_PAGE_ID }}
  RU_PAGE_TOKEN: ${{ secrets.RU_PAGE_TOKEN }}
  PT_PAGE_ID: ${{ secrets.PT_PAGE_ID }}
  PT_PAGE_TOKEN: ${{ secrets.PT_PAGE_TOKEN }}

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lang: [ja, he, es, fr, de, it, ko, zh, ru, pt]

    steps:
      - name: 🔍 Filter Language
        id: filter
        run: |
          TARGET="${{ inputs.language || 'all' }}"
          CURRENT="${{ matrix.lang }}"
          if [ "$TARGET" != "all" ] && [ "$TARGET" != "$CURRENT" ]; then
            echo "Skipping $CURRENT because $TARGET was selected."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "Running $CURRENT..."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: ⬇️ Checkout
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Fonts and FFmpeg
        if: steps.filter.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-wqy-microhei fonts-wqy-zenhei fonts-noto-core fonts-dejavu-core libraqm-dev

      - name: 📦 Install Python Requirements
        if: steps.filter.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Process
        if: steps.filter.outputs.should_run == 'true'
        run: |
          python run_brands.py --lang ${{ matrix.lang }} --youtube ${{ inputs.youtube || 'auto' }}

      - name: 💾 State Sync
        if: success() && steps.filter.outputs.should_run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ matrix.lang }}/output/history/*.json || true
          if ! git diff --staged --quiet; then
            git commit -m "sync state [skip ci]"
            for attempt in {1..8}; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Successfully pushed state update on attempt $attempt"
                break
              fi
              echo "Push failed, retrying in a moment..."
              sleep $(( RANDOM % 8 + 3 ))
            done
          fi

      - name: ⏱️ Inter-Channel Cooldown
        if: success() && steps.filter.outputs.should_run == 'true'
        run: |
          TARGET="${{ inputs.language || 'all' }}"
          CURRENT="${{ matrix.lang }}"
          COOLDOWN="${{ inputs.cooldown || '300' }}"
          if [ "$TARGET" = "all" ] && [ "$CURRENT" != "pt" ]; then
            echo "============================================================"
            echo "Finished publishing for $CURRENT."
            echo "Cooling down for ${COOLDOWN}s before next channel to prevent simultaneous posting..."
            echo "============================================================"
            sleep "$COOLDOWN"
          else
            echo "Skipping cooldown for $CURRENT (Target: $TARGET)."
          fi
