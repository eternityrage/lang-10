name: Matrix Pipeline Runner
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

env:
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  AI_MODEL: "openai-large"
  JA_PAGE_ID: ${{ secrets.KOTOKA_PAGE_ID }}
  JA_PAGE_TOKEN: ${{ secrets.KOTOKA_PAGE_TOKEN }}
  HE_PAGE_ID: ${{ secrets.IVRINA_PAGE_ID }}
  HE_PAGE_TOKEN: ${{ secrets.IVRINA_PAGE_TOKEN }}
  ES_PAGE_ID: ${{ secrets.VOBLO_PAGE_ID }}
  ES_PAGE_TOKEN: ${{ secrets.VOBLO_PAGE_TOKEN }}
  FR_PAGE_ID: ${{ secrets.DIMOI_PAGE_ID }}
  FR_PAGE_TOKEN: ${{ secrets.DIMOI_PAGE_TOKEN }}
  DE_PAGE_ID: ${{ secrets.SPRACHO_PAGE_ID }}
  DE_PAGE_TOKEN: ${{ secrets.SPRACHO_PAGE_TOKEN }}
  IT_PAGE_ID: ${{ secrets.DICOO_PAGE_ID }}
  IT_PAGE_TOKEN: ${{ secrets.DICOO_PAGE_TOKEN }}
  KO_PAGE_ID: ${{ secrets.MALAMOO_PAGE_ID }}
  KO_PAGE_TOKEN: ${{ secrets.MALAMOO_PAGE_TOKEN }}
  ZH_PAGE_ID: ${{ secrets.BOHUA_PAGE_ID }}
  ZH_PAGE_TOKEN: ${{ secrets.BOHUA_PAGE_TOKEN }}
  RU_PAGE_ID: ${{ secrets.GOVORO_PAGE_ID }}
  RU_PAGE_TOKEN: ${{ secrets.GOVORO_PAGE_TOKEN }}
  PT_PAGE_ID: ${{ secrets.FALOO_PAGE_ID }}
  PT_PAGE_TOKEN: ${{ secrets.FALOO_PAGE_TOKEN }}

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, he, es, fr, de, it, ko, zh, ru, pt]

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-microhei fonts-wqy-zenhei fonts-noto-core fonts-dejavu-core fonts-sil-culmus

      - name: 📦 Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Process
        run: |
          python run_brands.py --lang ${{ matrix.lang }}

      - name: 💾 State Sync
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ matrix.lang }}/output/history/*.json || true
          if ! git diff --staged --quiet; then
            git commit -m "sync state [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi
